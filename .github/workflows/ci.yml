name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref, so a force-push does not leave a
# stale run burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `toolchain` input on purpose: the pinned channel and components in
      # rust-toolchain.toml are the single source of truth. Caching and the
      # cargo/clippy/rustfmt problem matchers come with the action, as does
      # RUSTFLAGS=-D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The only step that validates intra-doc links. A link to a private or
      # renamed item is a warning nothing else catches, and this crate leans
      # heavily on its documentation.
      - name: Documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings